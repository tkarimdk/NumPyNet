[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numpynet-dk"
version = "0.5.0"
description = "An educational neural network implemented from first principles with NumPy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
keywords = ["neural-network", "backpropagation", "numpy", "machine-learning", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.scripts]
numpynet = "numpynet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
